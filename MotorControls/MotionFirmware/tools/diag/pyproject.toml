[project]
name = "motion-diag-cli"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["motion-diagnostics", "pyserial>=3.5"]

[project.scripts]
motion-diag = "diag.cli:main"

[tool.uv.sources]
motion-diagnostics = { path = "../../../../packages/motion_diagnostics", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diag"]

[dependency-groups]
dev = ["pytest>=8", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-artifacts"
